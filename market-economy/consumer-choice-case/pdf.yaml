# Оформление PDF решения (pandoc + typst)
papersize: a4
fontsize: 11pt
mainfont: "Libertinus Serif"
lang: ru
margin:
  x: 2cm
  y: 2cm
header-includes: |
  ```{=typst}
  // Таблицы: сетка, текст слева, шапка жирным; графики не на всю ширину
  #set table(stroke: 0.5pt + luma(150), inset: (x: 5pt, y: 4pt))
  #show table.cell: set par(justify: false)
  #show table.cell: set align(left)
  #show table.cell.where(y: 0): set text(weight: "bold")
  #show table: set text(size: 9.5pt)
  #set image(width: 60%)
  #show heading: set block(above: 1.3em, below: 0.7em)
  ```
